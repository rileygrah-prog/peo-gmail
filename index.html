<h1>PEO</h1>
<p>PEO is a private, single-user tool. It helps its owner organise their own day and keep an eye on their own personal Gmail inbox.</p>
<p>It isn't offered to anyone else, and nobody else can sign in to it.</p>
<p>Its Gmail access is read-only. It never sends, deletes or changes email.</p>
